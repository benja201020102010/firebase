<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotores El Poly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Automotores El Poly</h1>

    <h2>Agregar auto</h2>

    <input type="text" id="marca" placeholder="Marca">
    <input type="text" id="modelo" placeholder="Modelo">
    <input type="number" id="año" placeholder="Año">
    <input type="number" id="precio" placeholder="Precio">
    <input type="text" id="imagen" placeholder="URL de imagen">

    <button id="btnAgregar">Agregar auto</button>

    <h2>Buscar autos</h2>

    <input type="text" id="buscar" placeholder="Buscar por marca, modelo o año">

    <div id="resultados"></div>

    <script type="module" src="index.js"></script>

</body>
</html>
